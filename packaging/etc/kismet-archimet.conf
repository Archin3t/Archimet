# Archimet's settings for the upstream Kismet engine. kismet.service loads this file with --override
# (vendor drop-in /usr/lib/systemd/system/kismet.service.d/archimet.conf), so these settings take
# precedence over /etc/kismet/*.conf and kismet_site.conf, and survive Kismet package upgrades.
# Capture sources stay in /etc/kismet/kismet_site.conf (source=...). Never list the hotspot radio.

# Kismet's web server is for Archimet only: loopback, a private port. Users reach Archimet through
# archimet-gateway (0.0.0.0:2501), which serves Archimet and proxies only the API routes it uses.
httpd_bind_address=127.0.0.1
httpd_port=2500

# Even locally, Kismet serves Archimet's files, never its stock pages, and no per-user static root.
httpd_home=/usr/share/archimet/www/
httpd_user_home=/usr/share/archimet/no-user-web-root/

# Archimet's retention policy: no Kismet packet / session logs, no handshakes, no remote capture.
enable_logging=false
dot11_keep_eapol=false
remote_capture_enabled=false
