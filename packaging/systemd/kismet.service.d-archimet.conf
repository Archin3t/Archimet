# Installed by the archimet package as /usr/lib/systemd/system/kismet.service.d/archimet.conf.
# Runs the upstream kismet.service with Archimet's engine settings (loopback-only web server on port
# 2500, Archimet web root, retention policy). The account it runs as comes from
# /etc/systemd/system/kismet.service.d/10-archimet-user.conf (written by the package).
[Unit]
Description=Kismet capture engine (Archimet)

[Service]
ExecStart=
ExecStart=/usr/bin/kismet --no-ncurses-wrapper --override /etc/archimet/kismet-archimet.conf
Restart=always
RestartSec=5
